# Deploys the Cloudflare Worker (cncg-in) on every push to `main`, when
# invoked manually, or when the sync-events workflow commits updated data.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#
#   CLOUDFLARE_API_TOKEN
#     Create at https://dash.cloudflare.com/profile/api-tokens
#     → "Edit Cloudflare Workers" template, or custom token with at least:
#       Account · Cloudflare Workers Scripts · Edit
#       Account · Account Settings · Read  (for account ID validation)
#       Zone · Zone · Read  (if using routes on a zone)
#     Safer: restrict token to your account only.
#
#   CLOUDFLARE_ACCOUNT_ID
#     Dashboard right sidebar on any zone, or: npx wrangler whoami
#
# Optional MCP: add a GitHub MCP server in Cursor (Settings → MCP) if you want
# IDE tools for issues/PRs — use the GitHub CLI (`gh`) or the web UI for secrets.
#
# After adding secrets, push to main or run the workflow manually:
# Actions → Deploy to Cloudflare Workers → Run workflow.

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to deploy (defaults to the caller branch)
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify smoke lists match data
        run: npm run smoke:verify

      - name: Build for Cloudflare Workers
        run: npm run build:cf
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
