# Sync latest events from ocgroups.dev into data/groups.yaml every 6 hours.
#
# Requires "Read and write" permission for GITHUB_TOKEN (default for
# workflows triggered from the same repo on push; scheduled runs need
# Settings → Actions → General → Workflow permissions → Read and write).

name: Sync OCG Events

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-ocg-events
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch & update groups.yaml
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest events from ocgroups.dev
        run: npm run sync:events

      - name: Regenerate groups.json
        run: npm run build:groups

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/groups.yaml data/groups.json public/group-icons; then
            echo "No sync changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/groups.yaml data/groups.json public/group-icons
          git commit \
            -m "chore(data): sync OCG events and group icons" \
            -m "Automated update from ocgroups.dev (scheduled every 6 hours)."
          git push
