# Sync latest events from ocgroups.dev into data/groups.yaml every 6 hours.
# When data changes, commits to main and triggers a Cloudflare Workers deploy.
# (Pushes from GITHUB_TOKEN do not fire push-triggered workflows, so deploy is
# invoked explicitly via workflow_call.)

name: Sync OCG Events

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-ocg-events
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch & update groups.yaml
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      commit_sha: ${{ steps.changes.outputs.commit_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest events from ocgroups.dev
        run: npm run sync:events

      - name: Regenerate groups.json
        run: npm run build:groups

      - name: Commit and push if changed
        id: changes
        run: |
          if git diff --quiet -- data/groups.yaml data/groups.json public/group-icons; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No sync changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/groups.yaml data/groups.json public/group-icons
          git commit \
            -m "chore(data): sync OCG events and group icons" \
            -m "Automated update from ocgroups.dev (scheduled every 6 hours)."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build & Deploy
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.sync.outputs.commit_sha }}
    secrets: inherit
