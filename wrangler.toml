# Deployed as a Cloudflare Worker (NOT Pages).
# Use: npm run deploy  (or: npx wrangler deploy after npm run build:cf)
#
# Built with @opennextjs/cloudflare — output lives in .open-next/
#
# DNS setup required in the Cloudflare dashboard for zone cncg.in:
#   - Add a proxied wildcard A record: * → 192.0.2.1 (dummy IP, proxied)
#     OR a proxied CNAME: * → cncg-in.workers.dev (proxied)
#   Worker routes below intercept matching traffic before DNS resolution matters.

name = "cncg-in"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

main = ".open-next/worker.js"

routes = [
  { pattern = "cncg.in/*", zone_name = "cncg.in" },
  { pattern = "*.cncg.in/*", zone_name = "cncg.in" }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
# Run the Worker before static assets so middleware can inspect Host and
# rewrite subdomain requests (e.g. karnataka.cncg.in → /state/karnataka).
run_worker_first = true

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "cncg-in"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
